[project]
name = "factline"
version = "0.1.0"
description = "Fact-first RAG orchestration — LangGraph, Qdrant hybrid retrieval, faithfulness-gated answers."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Palash Jauhari" }]
keywords = ["rag", "langgraph", "qdrant", "retrieval", "agents"]

# Install runtime deps via: pip install -r requirements.txt
# (kept as requirements.txt so start.sh / CI stay simple).

[project.urls]
Repository = "https://github.com/PalashJauhari/RAG"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
